apiVersion: v1
kind: Service
metadata:
  name: {{ include "maplarge.headlessServiceName" . }}
  labels:
    app.kubernetes.io/name: dns-headless-service
    app.kubernetes.io/component: cluster-dns
    app.kubernetes.io/part-of: {{ include "maplarge.name" . }}
    application: {{ .Release.Name | quote }}
    {{- include "maplarge.labels" . | nindent 4 }}
  {{- with .Values.headlessService.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: "ClusterIP"
  clusterIP: None
  sessionAffinity: None
  publishNotReadyAddresses: true
  ports:
    # Headless services do not remap ports: pods are reached directly on the
    # container port, so the declared port must match the listen port.
    - port: {{ include "maplarge.containerPort" . }}
      targetPort: {{ include "maplarge.scheme" . }}
      protocol: TCP
      name: web
  selector:
    {{- include "maplarge.selectorLabels" . | nindent 4 }}
