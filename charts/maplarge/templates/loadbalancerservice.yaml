apiVersion: v1
kind: Service
metadata:
  name: {{ include "maplarge.balancerServiceName" . }}
  labels:
    app.kubernetes.io/name: kubernetes-lb
    app.kubernetes.io/component: load-balancer
    app.kubernetes.io/part-of: {{ include "maplarge.name" . }}
    application: {{ .Release.Name | quote }}
    {{- include "maplarge.labels" . | nindent 4 }}
  {{- with .Values.loadBalancerService.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: "ClusterIP"
  sessionAffinity: None
  ports:
    - port: {{ include "maplarge.servicePort" . }}
      targetPort: {{ include "maplarge.scheme" . }}
      protocol: TCP
      name: web
  selector:
    {{- include "maplarge.selectorLabels" . | nindent 4 }}
