{{- if .Values.ingress.enabled -}}
{{- $annotations := .Values.ingress.annotations -}}
{{- $extraPaths := .Values.ingress.extraPaths -}}
{{- $pathType := .Values.ingress.pathType | default "Prefix" -}}
{{- $path := ternary "/*" "/" (eq $pathType "ImplementationSpecific") -}}
{{- $fullName := include "maplarge.fullname" . -}}
{{- $ingressName := include "maplarge.ingressName" . -}}
{{- $loadBalancerServiceName := include "maplarge.balancerServiceName" . -}}
{{ $policyHost := include "maplarge.hostname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $ingressName }}
  labels:
    application: {{ .Release.Name | quote }}
    {{- include "maplarge.labels" . | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
{{- with .Values.ingress }}
  {{- if .class }}
  ingressClassName: {{ .class }}
  {{- end }}
{{- $tlsHosts := list }}
{{- range .hosts }}
{{- if .tls.enabled }}{{- $tlsHosts = append $tlsHosts . }}{{- end }}
{{- end }}
{{- if $tlsHosts }}
  tls:
{{- range $tlsHosts }}
    - hosts:
        - {{ .baseHostname | lower | quote }}
{{- $baseHostname := .baseHostname | lower -}}
{{- range untilStep 0 (int .prefixes) 1 }}
        - {{ (printf "%d%s" . $baseHostname) | lower | quote }}
{{- end }}
{{- if .tls.secretName }}
      secretName: {{ .tls.secretName }}
{{- end }}
{{- end }}
{{- end }}
  rules:
{{- range .hosts }}
    - host: {{ .baseHostname | lower | quote }}
      http:
        paths:
{{- with $extraPaths }}
          {{- toYaml . | nindent 10 }}
{{- end }}
          - path: {{ $path }}
            pathType: {{ $pathType }}
            backend:
              service:
                name: {{ $loadBalancerServiceName }}
                port:
                  name: web
{{- $baseHostname := .baseHostname -}}
{{- range untilStep 0 (int .prefixes) 1}}
    - host: {{ printf "%d%s" . $baseHostname | lower }}
      http:
        paths:
{{- with $extraPaths }}
          {{- toYaml . | nindent 10 }}
{{- end }}
          - path: {{ $path }}
            pathType: {{ $pathType }}
            backend:
              service:
                name: {{ $loadBalancerServiceName }}
                port:
                  name: web
{{- end }}
{{- end }}
{{- end }}
{{- end }}



