{{- if and (.Values.hooks.preUpgradeHook.enabled) (gt (.Values.replicas | int) 1) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "maplarge.fullname" . }}-version-check
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "0"
spec:
  backoffLimit: 0
  template:
    spec:
      {{- $pullSecret := include "maplarge.pullSecretName" . | trim }}
      {{- if or $pullSecret .Values.image.extraPullSecrets }}
      imagePullSecrets:
      {{- if $pullSecret }}
        - name: {{ $pullSecret }}
      {{- end }}
      {{- if .Values.image.extraPullSecrets }}
      {{- toYaml .Values.image.extraPullSecrets | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (.Values.tolerations) (.Values.simpleTolerations) }}
      tolerations:
      {{- if .Values.tolerations }}
      {{- with .Values.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end}}
      {{- else }}
      {{- range .Values.simpleTolerations }}
        - key: {{ . | quote }}
          operator: "Exists"
      {{- end }}
      {{- end }}
      {{- end }}
      serviceAccountName: {{ include "maplarge.fullname" . }}-update-hook
      restartPolicy: Never
      volumes:
        - name: workdir
          emptyDir: {}

      initContainers:
        - name: get-new-version
          image: "{{ .Values.image.repository }}:{{ include "maplarge.imageTag" . }}"
          volumeMounts:
            - name: workdir
              mountPath: /workdir
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat /opt/maplarge/server/version.txt > /workdir/new_version.txt
      containers:
        - name: compare-and-scale
          image: "{{ .Values.hooks.preUpgradeHook.image.repository }}:{{ .Values.hooks.preUpgradeHook.image.tag }}"
          volumeMounts:
            - name: workdir
              mountPath: /workdir
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              STS_NAME="{{ include "maplarge.fullname" . }}"
              NAMESPACE="{{ .Release.Namespace }}"
              # Listen port and port name (scheme) this upgrade will apply, baked
              # in at template time. Compared against the live StatefulSet below.
              NEW_PORT="{{ include "maplarge.containerPort" . }}"
              NEW_PORT_NAME="{{ include "maplarge.scheme" . }}"

              NEW_RAW=$(cat /workdir/new_version.txt | tr -d '\n')

              if ! kubectl get sts $STS_NAME -n $NAMESPACE > /dev/null 2>&1; then
                  echo "StatefulSet not found. Fresh install. Skipping."
                  exit 0
              fi

              echo "Checking currently running version..."
              OLD_RAW=$(kubectl exec $STS_NAME-0 -n $NAMESPACE -- cat /opt/maplarge/server/version.txt | tr -d '\n')

              echo "Raw Versions: Old='$OLD_RAW', New='$NEW_RAW'"

              get_db_version() {
                echo "$1" | cut -d. -f4 | cut -d- -f1
              }

              is_int() {
                case $1 in
                    ''|*[!0-9]*) return 1 ;;
                    *) return 0 ;;
                esac
              }

              scale_down() {
                kubectl scale sts $STS_NAME -n $NAMESPACE --replicas=0

                echo "Waiting for pods to terminate..."
                kubectl wait --for=delete pod -l app.kubernetes.io/instance={{ .Release.Name }} --timeout=300s
                echo "Cluster scaled down. Helm will now bring up new pods."
              }

              NEW_DB_VERSION=$(get_db_version "$NEW_RAW")
              OLD_DB_VERSION=$(get_db_version "$OLD_RAW")

              echo "Parsed DB Versions: Old='$OLD_DB_VERSION', New='$NEW_DB_VERSION'"

              SCALE_REASON=""
              if ! is_int "$NEW_DB_VERSION" || ! is_int "$OLD_DB_VERSION"; then
                  echo "FORMAT CHANGE DETECTED: One or both versions do not match the 4-part dot schema."
                  SCALE_REASON="db version format change; treating this as a structural upgrade"
              elif [ "$NEW_DB_VERSION" -lt "$OLD_DB_VERSION" ]; then
                  # --- DOWNGRADE PROTECTION ---
                  MSG="BLOCKING DOWNGRADE: Target db version ($NEW_DB_VERSION) is older than current db version ($OLD_DB_VERSION). Downgrades are not supported via this pipeline. Aborting Helm upgrade."
                  echo "$MSG"
                  echo "$MSG" > /dev/termination-log
                  exit 1
              elif [ "$NEW_DB_VERSION" != "$OLD_DB_VERSION" ]; then
                  echo "MISMATCH DETECTED! ($OLD_DB_VERSION -> $NEW_DB_VERSION)"
                  SCALE_REASON="db version change $OLD_DB_VERSION -> $NEW_DB_VERSION"
              fi

              # A listen port or scheme change breaks the cluster mesh during a
              # rolling update (old and new pods advertise different addresses),
              # so it also requires a full restart.
              if [ -z "$SCALE_REASON" ]; then
                  OLD_PORT=$(kubectl get sts $STS_NAME -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[?(@.name=="{{ .Chart.Name }}")].ports[0].containerPort}')
                  OLD_PORT_NAME=$(kubectl get sts $STS_NAME -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[?(@.name=="{{ .Chart.Name }}")].ports[0].name}')
                  echo "Listen ports: Old='$OLD_PORT_NAME/$OLD_PORT', New='$NEW_PORT_NAME/$NEW_PORT'"
                  if [ "$OLD_PORT" != "$NEW_PORT" ] || [ "$OLD_PORT_NAME" != "$NEW_PORT_NAME" ]; then
                      echo "LISTEN PORT/SCHEME CHANGE DETECTED! ($OLD_PORT_NAME/$OLD_PORT -> $NEW_PORT_NAME/$NEW_PORT)"
                      SCALE_REASON="listen port/scheme change"
                  fi
              fi

              if [ -n "$SCALE_REASON" ]; then
                  echo "Scaling down to 0 to perform clean upgrade ($SCALE_REASON)..."
                  scale_down
              else
                  echo "Build IDs and listen port match. Standard rolling update is safe."
              fi
{{- end }}
