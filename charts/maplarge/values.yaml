##################################
# 1. App information             #
##################################

image: # @schema additionalProperties: false
  # -- Image pull policy
  # @section -- Image Information
  pullPolicy: IfNotPresent # @schema enum: [Always, IfNotPresent, Never]
  # -- Secret to create or use to pull the docker image from the registry. Leave empty if the cluster can pull without one.
  # @section -- Image Information
  pullSecretName: "" # @schema type: [string, null]
  # -- An array of any extra image pull secrets to add to the pod definition, in
  # @section -- Image Information
  extraPullSecrets: [] # @schema item: object
  # Example:
  # extraPullSecrets
  #   - name: my-pull-secret
  # -- The fully qualified repository where the MapLarge image should be pulled from
  # @section -- Image Information
  repository: docker.io/maplarge/server # @schema minLength: 1
  # -- The MapLarge image tag to pull. When empty, defaults to the release tag for the chart's appVersion (release-core-<appVersion>).
  # @section -- Image Information
  tag: "" # @schema type: [string, null]

license: # @schema additionalProperties: false
  # -- A secret name for an existing license secret. If creating your own license secret, the key must be "_maplarge_license.lic"
  # @section -- License
  existingSecretName: ""
  # -- The content of the MapLarge license if one has been provided to you
  # @section -- License
  license: ""
  # -- Annotations to set on the license secret
  # @section -- License
  annotations: {}

# -- replicas The number of replicas to create in the StatefulSet. Defaults to 1.
# @section -- General
replicas: 3 # @schema minimum: 1

# -- Overrides the chart name used to name resources
# @section -- General
nameOverride: # @schema type: [string, null]

# -- Overrides the fully qualified app name used to name resources
# @section -- General
fullnameOverride: # @schema type: [string, null]

# -- When set, adds team ownership labels (maplarge.com/project, team, app.kubernetes.io/owner) to all resources
# @section -- General
team: # @schema type: [string, null]

# When set to `true`, `config.json` will be saved to `App_Data/config`.
# When set to `false`, all configuation must be set by environment variables, mapped from a `ConfigMap` or otherwise managed by the administrator and mounted to the location `/opt/maplarge/config/config.json` (by default)
# -- persistConfiguration Determines how MapLarge configurations are to be persisted in the deployment
# @ignore
persistConfiguration: false

# -- configurationDirectory Overrides the directory in the container where MapLarge configuration is mounted. Defaults to /opt/maplarge/config
# @ignore
configurationDirectory: # @schema type: [string, null]

# -- initContainerImage Overrides the image used for init containers. Defaults to busybox:1.28
# @ignore
initContainerImage: # @schema type: [string, null]
# -- podAnnotations Extra annotations to add to your pods' metadata. Usually unnecessary.
# @section -- General
podAnnotations: {}
# Example:
#   maplarge-version: 4.95.0

# Limits are enforced by Kubernetes. If you exceed memory limit, your container may be killed without warning.
# Requests must be less than or equal to limits. Usually set them equal to limits.
resources: # @schema additionalProperties: false
  limits: # @schema additionalProperties: false
    # -- The CPU Limit to set for the pod
    # @section -- Deployment Resources
    cpu: 4 # @schema type: [string, integer]
    # -- The Memory Limit to set for the pod
    # @section -- Deployment Resources
    memory: 8Gi # @schema type: [string, integer]
  requests: # @schema additionalProperties: false
    # -- The CPU Request to set for the pod
    # @section -- Deployment Resources
    cpu: 1 # @schema type: [string, integer]
    # -- The Memory Request to set for the pod
    # @section -- Deployment Resources
    memory: 4Gi # @schema type: [string, integer]

# Storage options for the App_Data PVC attached to each replica.
storage: # @schema additionalProperties: false
  # -- Defines the size of the PVC to be attached. Values are in GB
  # @section -- Storage Information
  size: 100 # @schema minimum: 1
  # -- Requested storage class name. When unset, the cluster's default storage class is used.
  # @section -- Storage Information
  storageClass: # @schema type: [string, null]


# -- If set, the root password will be set according to this value, otherwise a default value is created
# @section -- MapLarge Configuration
rootPassword: # @schema type: [string, null]

# -- If set, defines the name of the secret for the root password
# @section -- MapLarge Configuration
rootPasswordSecretName: # @schema type: [string, null]

# -- An existing secret that contains a value that will be used as the root password; the key must be set to `rootPassword`
# @section -- MapLarge Configuration
existingRootPasswordSecretName: # @schema type: [string, null]

# -- Enables CORS in the MapLarge client config (sets ML_CLIENT_CONFIG_ENABLE_CORS)
# @section -- MapLarge Configuration
corsEnabled: true

# -- Allowed CORS origins (sets ML_CORS_ALLOWED_ORIGINS)
# @section -- MapLarge Configuration
corsAllowedOrigins: "%"

# -- Enables MapLarge replication (sets ML_REPL_ENABLED)
# @section -- MapLarge Configuration
replicationEnabled: false

# Some MapLarge configurations can be controlled via environment variables. These
# can be set here.
# -- A map of extra environment variables to be added to the MapLarge container
# @section -- MapLarge Configuration
environmentVariables: # @schema itemProperties: {"name": {"type": "string"}, "value": {"type": "string"}} ; allOf: [{"items": {"required": ["name"]}}]
  - name: ML_STDERR_LOG_LEVEL
    value: "2"
  - name: ml_cfg_homepageRedirect
    value: "dashboard"

# -- A second list of extra environment variables to be added to the MapLarge container, merged after environmentVariables
# @section -- MapLarge Configuration
extraEnvironmentVariables: [] # @schema item: object ; itemProperties: {"name": {"type": "string"}, "value": {"type": "string"}} ; allOf: [{"items": {"required": ["name"]}}]

# -- Allows for custom configurations for the js.js. This value is read in as-is, so each js.js option needs to be on it's own line.
# @section -- MapLarge Configuration
jsjs:
  value: | # @schema type: [string, null]

# -- (object) Allows for custom configurations for the MapLarge config.json.
# @section -- MapLarge Configuration
config: # @schema type: [object, null]
  # Used for an InitContainer when MapLarge Notebooks are enabled.
  # This can be changed to any image desired as the initContainers
  # are only running simple shell commands
  # workloadSchedulerScratchImage: "busybox"

serviceAccount: # @schema additionalProperties: false
  # -- Specificies whether a service account should be created. If the deploying user does not have permissions to create an SA, then this value should be set to false.
  # @section -- General
  create: false
  # -- To use an existing service account, provide the name here. If not set and create is true, a name is generated using the maplarge.name template.
  # @section -- General
  name: ""
  # -- Specifies Service Account specific Annotations
  # @section -- General
  annotations: {}


# -- Set to true if you want to prefer that your replicas are placed on distinct nodes.
# @section -- General
preferNodeAntiAffinity: false

# -- Set to true if you want to REQUIRE that your replicas are placed on different nodes. Recommended for production; left off by default so small/single-node clusters can schedule all replicas.
# @section -- General
requireNodeAntiAffinity: false

# -- (map) extraLabels Extra labels to apply to all resources
# @section -- General
extraLabels: {}
# Example:
# extraLabels:
#   testing: 123

# -- extraVolumes Specify any extra list of additional volumes for MapLarge
# @section -- General
extraVolumes: []
# Example:
#   extraVolumes:
#   - name: extra-config
#     configMap:
#       name: test-config-map

# -- extraVolumeMounts Specify any extra list of additional volumeMounts for MapLarge
# @section -- General
extraVolumeMounts: []
# Example:
#   extraVolumeMounts:
#   - mountPath: /maplarge/
#     name: extra-config
#     subPath: ml-config.extra.yaml

# --  JSON object used to pre-populate intercluster sync settings
# @ignore
interClusterConfigJson: # @schema type: [string, null]

# -- (object) Extra configuration options for cluster.json
# @section -- General
clusterConfig: # @schema type: [object, null]

# -- headlessServiceName Overrides the name of the headless service used for StatefulSet pod DNS
# @ignore
headlessServiceName: # @schema type: [string, null]

# -- defaultClusterName Overrides the DefaultClusterName written to cluster.json. Defaults to maplarge-cluster
# @ignore
defaultClusterName: # @schema type: [string, null]

# -- numberOfAutoJoinMembers Overrides the number of StatefulSet members listed in AutoJoinCoreClusterMembers in cluster.json. Defaults to replicas.
# @ignore
numberOfAutoJoinMembers: # @schema type: [integer, null] ; minimum: 1

# -- useTransactionalDatabase NEED DEFINITION
# @ignore
useTransactionalDatabase: true

# -- updateStrategyType RollingUpdate (default) or OnDelete (will only update when you delete pod)
# @ignore
updateStrategyType: RollingUpdate # @schema enum: [RollingUpdate, OnDelete]

# -- podManagementPolicy Parallel (default) or OrderedReady
# @ignore
podManagementPolicy: Parallel # @schema enum: [Parallel, OrderedReady]

# -- revisionHistoryLimit
# @ignore
revisionHistoryLimit: 10 # @schema minimum: 0

# -- rollingUpdatePartition When set, adds a rollingUpdate partition of 0 to the update strategy
# @ignore
rollingUpdatePartition: # @schema type: [boolean, integer, null]

# -- terminationGracePeriodSeconds How long to wait for graceful exit
# @ignore
terminationGracePeriodSeconds: 120 # @schema minimum: 0

# -- terminationMessagePath
# @ignore
terminationMessagePath: /dev/termination-log

# -- terminationMessagePolicy
# @ignore
terminationMessagePolicy: File

# -- Sets a simple toleration for the MapLarge pod
# @section -- General
simpleTolerations: []
# Example:
# - MapLargeReserved

# -- Sets the tolerations for the MapLarge pod
# @section -- General
tolerations: [] # @schema item: object

# -- Sets simple node affinity preferences for the MapLarge pod
# @section -- General
simpleNodeAffinityPreferences: []
# Example:
# - SmallNode

# --  Sets the node affinity preferences for the MapLarge pod
# @section -- General
nodeAffinityPreferences: []

# -- Sets the node selector for the MapLarge pod
# @section -- General
nodeSelector: {}

# -- Sets the simpleNodeAffinityRequirements for the pod
# @section -- General
simpleNodeAffinityRequirements: []
# Example:
# - SpecialNode

# -- Sets the nodeAffinityRequirements for the pod
# @section -- General
nodeAffinityRequirements: []

# -- Sets the podSecurityContext. Defaults run the pod as a non-root user with a RuntimeDefault seccomp profile. Set to {} to fall back to cluster defaults.
# @section -- General
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault


# -- Sets the container securityContext. Defaults block privilege escalation, drop all capabilities, and mount the root filesystem read-only (/tmp is an emptyDir; App_Data is the PVC). Set to {} to fall back to cluster defaults.
# @section -- General
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -- this will create your pull secret for you. Required fields are registry, username, password, and email
# @section -- Docker configurations
dockerCredentials: {} # @schema patternProperties: {"^(registry|username|password|email)$": {"type": "string", "minLength": 1}} ; additionalProperties: false ; allOf: [{"dependentRequired": {"registry": ["username", "password", "email"], "username": ["registry", "password", "email"], "password": ["registry", "username", "email"], "email": ["registry", "username", "password"]}}]
# Example:
#   registry: docker.io
#   username: dockerhubusername
#   password: dockerhubpassword
#   email: dockerhub@emailaddress.com


# Probe httpGet port and scheme are derived from tls.enabled (http/HTTP, or
# https/HTTPS when TLS is on). Set httpGet.port / httpGet.scheme explicitly on
# any probe to override the derived values.
# This configuration allows the pod ten seconds to sixty minutes to become ready on startup.
startupProbe:
  # -- Endpoint for the startup probe
  # @section -- Probe Configurations
  httpGet:
    path: /Cluster/IsReady
  # -- Failure threshold for startupProbe
  # @section -- Probe Configurations
  failureThreshold: 360
  # -- Period seconds for startupProbe
  # @section -- Probe Configurations
  periodSeconds: 10

livenessProbe:
  httpGet:
    # -- Endpoint for the livenessProbe
    # @section -- Probe Configurations
    path: /Cluster/IsAlive
  # -- Failure threshold for livenessProbe
  # @section -- Probe Configurations
  failureThreshold: 6
  # -- Initial delay seconds for livenessProbe
  # @section -- Probe Configurations
  initialDelaySeconds: 0
  # -- Period seconds for livenessProbe
  # @section -- Probe Configurations
  periodSeconds: 5
  # -- Success Threshold for livenessProbe
  # @section -- Probe Configurations
  successThreshold: 1
  # -- Timeout seconds for livenessProbe
  # @section -- Probe Configurations
  timeoutSeconds: 2

readinessProbe:
  httpGet:
    # -- Endpoint for the readinessProbe
    # @section -- Probe Configurations
    path: /Cluster/IsReadyForUser
  # -- Failure threshold for readinessProbe
  # @section -- Probe Configurations
  failureThreshold: 3
  # -- Initial delay seconds for readinessProbe
  # @section -- Probe Configurations
  initialDelaySeconds: 0
  # -- Period seconds for readinessProbe
  # @section -- Probe Configurations
  periodSeconds: 5
  # -- Success Threshold for readinessProbe
  # @section -- Probe Configurations
  successThreshold: 2
  # -- Timeout seconds for readinessProbe
  # @section -- Probe Configurations
  timeoutSeconds: 2


notebooks: # @schema additionalProperties: false
  # -- Enables MapLarge Notebooks and creates the necessary Service Account, Role and RoleBinding
  # @section -- Notebook configurations
  enabled: false

## Database preload configurations
# -- preloadMLData.enabled Enables MapLarge to preload data from a remote docker image
# -- preloadMLData.image.pullPolicy Sets the image pull policy for the preload data image
# -- preloadMLData.image.repository The docker image containing the preload data required
# -- preloadMLData.image.tag The docker tag of the image preload docker image
# @ignore
preloadMLData: # @schema additionalProperties: false
  enabled: false
  image: # @schema additionalProperties: false
    pullPolicy: IfNotPresent # @schema enum: [Always, IfNotPresent, Never]
    repository: docker.io/maplarge/data-snapshots # @schema minLength: 1
    tag: 1-3-2022_4_10 # @schema minLength: 1

# -- The port the MapLarge container listens on. The chart passes it to the app via ML_LISTEN_PORT and uses it for the container port, the headless Service port, and cluster.json URLs. When unset, defaults to 8443 if tls.enabled is true, otherwise 8080. Must be >= 1024: the container runs as non-root without NET_BIND_SERVICE, so it cannot bind privileged ports.
# @section -- General
listenPort: # @schema type: [integer, null] ; minimum: 1024 ; maximum: 65535

headlessService: # @schema additionalProperties: false
  # -- Annotations to be added to the headless (cluster DNS) Service
  # @section -- General
  annotations: {}

loadBalancerService: # @schema additionalProperties: false
  # -- The in-cluster port the load balancer Service exposes. When unset, defaults to 443 if tls.enabled is true, otherwise 80. The ingress references this port by name, so changing it requires no ingress changes.
  # @section -- General
  port: # @schema type: [integer, null] ; minimum: 1 ; maximum: 65535
  # -- Annotations to be added to the load balancer Service
  # @section -- General
  annotations: {}

tls: # @schema additionalProperties: false
  # -- Set to true if the MapLarge container is configured to serve HTTPS. The chart then defaults the listen port to 8443 (Service port 443), names ports https so meshes detect the protocol, uses https for inter-node cluster communication, and probes over HTTPS. The app itself must be configured to serve TLS; this is distinct from ingress.hosts[].tls, which controls TLS at the ingress edge.
  # @section -- General
  enabled: false

# -- Rarely there is a time when you need to set the MapLarge hostname to something other than the ingress hostname, but if you do have that scenario, you can provide a hostname here to override the value that will be derived from the ingress.hosts[0].basehostname. Note, this does not modify the ingress hostname value.
# @section -- Ingress Configuration
hostnameOverride: # @schema type: [string, null]


# Specifies an authentication plugin
authPlugin: # @schema additionalProperties: false
  # -- Determines if the authPlugin should be enabled
  # @section -- MapLarge Configuration
  enabled: false
  # -- Specifies the MapLarge authPlugin to use
  # @section -- MapLarge Configuration
  typeName: # @schema type: [string, null]
  # -- Specifices the path in the container where the authPlugin configuration file can be found. Can be left blank.
  # @section -- MapLarge Configuration
  filename: # @schema type: [string, null]

ingress: # @schema additionalProperties: false
  # -- Enable ingress object
  # @section -- Ingress Configuration
  enabled: true
  # -- Ingress class to use. If not set, no ingressClassName will be set on the resource.
  # @section -- Ingress Configuration
  class: "" # @schema type: [string, null]
  # -- Annotations to set on the ingress object. No annotations are set by default;
  # add any ingress controller-specific annotations here as needed.
  # @section -- Ingress Configuration
  annotations: {} # @schema additionalProperties: {"type": "string"}
  hosts: # @schema minItems: 1 ; allOf: [{"items": {"propertyNames": {"enum": ["baseHostname", "prefixes", "tls"]}}}]
    # Usually you only need one host here, but this is an array field and accepts multiple values.
    # -- Custom DNS name where MapLarge can be reached
    # @section -- Ingress Configuration
    - baseHostname: maplarge.example.com # @schema required: true ; minLength: 1
    # -- The number of dns prefixes to create
    # @section -- Ingress Configuration
      prefixes: 8 # @schema minimum: 0
      tls: # @schema additionalProperties: false
        # -- Controls if the site is TLS protected
        # @section -- Ingress Configuration
        enabled: false
        # -- The TLS secret to use if TLS protected
        # @section -- Ingress Configuration
        secretName: # @schema type: [string, null]

hooks: # @schema additionalProperties: false
  # -- Enables pre-upgrade hook to ensure proper upgrade procedure for DB binary format revisions
  # @section -- Hooks
  preUpgradeHook: # @schema additionalProperties: false
    enabled: true
    image: # @schema additionalProperties: false
      # -- The image repository to use for the pre-upgrade hook job
      # @section -- Hooks
      repository: bitnami/kubectl # @schema minLength: 1
      # -- The image tag to use for the pre-upgrade hook job.
      # @section -- Hooks
      tag: "latest" # @schema minLength: 1

# extraObjects could be utilized to add dynamic manifests via values
# -- A list of extra Kubernetes manifests to render. Entries may be objects or strings; strings are passed through tpl for templating.
# @section -- General
extraObjects: [] # @schema item: [object, string]
# Examples:
# extraObjects:
# - apiVersion: external-secrets.io/v1
#   kind: ExternalSecret
#   metadata:
#     name: maplarge-root-password
#     annotations:
#   spec:
#     refreshInterval: 1h
#     secretStoreRef:
#       name: onepassword
#       kind: ClusterSecretStore
#     target:
#       name: maplarge-root-password
#     data:
#       - secretKey: rootPassword
#         remoteRef:
#           key: 'MapLarge Root Password'
#           property: password
# Alternatively, you can use strings, which lets you use additional templating features:
# extraObjects:
# - |
#   apiVersion: external-secrets.io/v1
#   kind: ExternalSecret
#   metadata:
#     name: maplarge-root-password
#     annotations:
#   spec:
#     refreshInterval: 1h
#     secretStoreRef:
#       name: onepassword
#       kind: ClusterSecretStore
#     target:
#       name: {{ include "some-other-template" }}
#     data:
#       - secretKey: rootPassword
#         remoteRef:
#           key: 'MapLarge Root Password'
#           property: password
