name: Generate Helm documentation and schema
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    # Only run on same-repo PRs (forks get read-only tokens and cannot push)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # Regenerates values.schema.json from the @schema annotations in
      # values.yaml (configured by charts/maplarge/.schema.yaml)
      - name: Generate values schema
        uses: losisin/helm-values-schema-json-action@cfefdf4241da6dbe17f3378e3cd0e863d4a4c3c8 # v3.0.1
        with:
          working-directory: charts/maplarge
          git-push: true
          git-commit-message: update values.schema.json

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@6f957579ac122ecc167bf515fe84e828686c9a15 # v1.7.1
        with:
          git-push: true