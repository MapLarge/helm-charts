name: Release Charts

# Releases are cut by pushing a tag matching chart-releaser's tag format:
#   git tag maplarge-<version> && git push origin maplarge-<version>
# The tag must match the version in charts/maplarge/Chart.yaml at the tagged
# commit, and should point at a commit on main.
on:
  push:
    tags:
      - "maplarge-*"

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Verify tag matches chart version
        run: |
          CHART_VERSION=$(awk '/^version:/{print $2}' charts/maplarge/Chart.yaml)
          EXPECTED="maplarge-${CHART_VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED" ]]; then
            echo "ERROR: tag '$GITHUB_REF_NAME' does not match the chart version at this commit (expected '$EXPECTED')"
            exit 1
          fi
          echo "Tag matches chart version $CHART_VERSION"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          skip_existing: true
          packages_with_index: true

        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  release-oci:
    # Runs only after the classic release succeeds, so the tag/version guard
    # in that job also gates the OCI publication.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push charts
        run: |
          for chart in charts/*/; do
            CHART_NAME=$(basename "$chart")
            CHART_VERSION=$(yq '.version' "$chart/Chart.yaml")

            echo "Packaging $CHART_NAME version $CHART_VERSION"
            helm package "$chart"

            echo "Pushing to GHCR"
            helm push "${CHART_NAME}-${CHART_VERSION}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
          done