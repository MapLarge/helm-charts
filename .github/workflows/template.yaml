name: Lint and Test Charts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.17.0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          changed=$(ct list-changed --target-branch "$DEFAULT_BRANCH")
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --target-branch "$DEFAULT_BRANCH" --validate-maintainers=false

      - name: Run helm template
        run: helm template charts/maplarge

      # values.schema.json must reject the known-invalid fixture; if this
      # passes, the schema has lost constraints (e.g. a bad regeneration)
      - name: Verify schema rejects invalid values
        run: |
          if helm template charts/maplarge -f charts/maplarge/tests/schema-rejects.yaml > /dev/null 2>&1; then
            echo "ERROR: tests/schema-rejects.yaml passed schema validation but every value in it is invalid"
            exit 1
          fi
          echo "Schema correctly rejects invalid values"

  # Scans the rendered chart for security misconfigurations. Accepted findings
  # are documented with justifications in charts/maplarge/.trivyignore.
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: charts/maplarge
          trivyignores: charts/maplarge/.trivyignore
          exit-code: '1'